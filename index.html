<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>設備管理系統 - 登入</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background-color: #f8f9fa; padding: 16px;
    }
    .login-card {
      background: #ffffff; width: 100%; max-width: 380px; padding: 32px 24px;
      border-radius: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    h2 { margin: 0 0 8px 0; text-align: center; color: #212529; font-size: 22px; }
    p.subtitle { margin: 0 0 24px 0; text-align: center; color: #6c757d; font-size: 14px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: bold; color: #495057; }
    input {
      width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; outline: none;
    }
    input:focus { border-color: #0d6efd; }
    button {
      width: 100%; padding: 12px; background-color: #0d6efd; color: #ffffff;
      border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px;
    }
    button:hover { background-color: #0b5ed7; }
    button:disabled { background-color: #8bb9fe; cursor: not-allowed; }
    .error-msg {
      margin-top: 14px; padding: 10px; border-radius: 6px;
      background-color: #f8d7da; color: #842029; font-size: 14px; text-align: center; display: none;
    }
    .links { margin-top: 20px; text-align: center; font-size: 14px; }
    .links a { color: #6c757d; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="login-card">
  <h2>🔐 設備借還管理系統</h2>
  <p class="subtitle">請輸入教師代號或學號登入</p>

  <form id="loginForm">
    <div class="form-group">
      <label for="userId">帳號 (教師代號 / 學號)</label>
      <input type="text" id="userId" placeholder="例如：1001 或 411012001" required autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password">密碼</label>
      <input type="password" id="password" placeholder="請輸入密碼" required autocomplete="current-password">
    </div>
    <button type="submit" id="submitBtn">登入系統</button>
    <div id="errorMsg" class="error-msg"></div>
  </form>

  <div class="links">
    <a href="status.html">📋 直接查看設備狀態總覽 →</a>
  </div>
</div>

<script>
  // ★★★ 請確認此處為您最新的 GAS 網頁應用程式網址 ★★★
  const API_URL = "https://script.google.com/macros/s/AKfycbx4SDTkvKEwUwMriTVy-NNDQ2g5Yy_SoUbtAwSmPlQISgk9Ie1xOj2FTaU0CaXxWvo-/exec";

  // 若已經登入過，直接跳轉到 scan.html
  if (sessionStorage.getItem("eq_user")) {
    window.location.href = "scan.html";
  }

  document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const userId = document.getElementById("userId").value.trim();
    const password = document.getElementById("password").value.trim();
    const submitBtn = document.getElementById("submitBtn");
    const errorMsg = document.getElementById("errorMsg");

    errorMsg.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "驗證中...";

    try {
      const url = `${API_URL}?action=login&user_id=${encodeURIComponent(userId)}&password=${encodeURIComponent(password)}`;
      const response = await fetch(url);
      const result = await response.json();

      if (result.success) {
        sessionStorage.setItem("eq_user", JSON.stringify(result.user));
        window.location.href = "scan.html";
      } else {
        errorMsg.textContent = result.message || "登入失敗";
        errorMsg.style.display = "block";
      }
    } catch (err) {
      errorMsg.textContent = "連線失敗，請檢查網路或 API_URL 設定。";
      errorMsg.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "登入系統";
    }
  });
</script>

</body>
</html>
